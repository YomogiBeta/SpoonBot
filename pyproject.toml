[project]
name = "spoonbot"
version = "0.1.0"
description = "An unofficial wrapper library that makes it easier to use the official API of the live streaming service \"Spoon\""
readme = "README.md"
authors = [
    { name = "YomogiBeta" }
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "oauthlib>=4.0.0",
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "aiomysql>=0.3.2",
    "uuid-utils>=1.0.0",
    "itsdangerous>=2.2.0",
    "aiohttp-sse-client2>=0.3.0",

    # https://github.com/aio-libs/aiomysql/issues/1080
    # https://github.com/aio-libs/aiomysql/pull/1081
    "PyMySQL<=1.2.0"
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.142.2"
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
[tool.ruff.lint]
select = ["E", "F", "PLE"]
