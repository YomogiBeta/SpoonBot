
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ボットを招待して利用を開始しましょう。">
  <title>ボット招待 | spoonbot</title>
  <link rel="stylesheet" href="/assets/css/invite.css">
</head>
<body class="invite-page">

  <header class="invite-header">
    <a href="/spoonbot/connect" class="invite-brand">spoonbot</a>
  </header>

  <main class="invite-main">
    <section class="invite-content" aria-labelledby="invite-title">

      <div class="invite-icon" aria-hidden="true">
        <img src="/assets/image/bot-icon.svg" />
      </div>

      <p class="invite-eyebrow">BOT INVITATION</p>

      <h1 id="invite-title" class="invite-title">
        <span class="bot-name"></span> を招待する
      </h1>

      <p class="invite-description">
        貴方の枠に<span class="bot-name"></span>ボットを招待します。今後も<span class="bot-name"></span>ボットを招待したいときは、本URLからいつでも可能です。
      </p>

      <button type="button" id="invite-button" class="invite-primary-button">
        <span>今すぐbotを招待する<strong>(ライブ配信開始後に招待してください)</strong></span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 12H19M12 5L19 12L12 19"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <a href="#" id="bot-operation-page" class="invite-secondary-button hidden">
        bot専用ページへ
      </a>

      <p class="bookmark-help">
        このページはBookmarkしておくことをお勧めします。
      </p>

    </section>
  </main>

  <footer class="invite-footer">
    <span>Powered by</span>
    <strong>spoonbot lib</strong>
    <span class="invite-footer-separator" aria-hidden="true">·</span>
    <span>made by YomogiBeta</span>
  </footer>
 <script src="/assets/javascript/main.js" type="module"></script>
</body>
</html>
