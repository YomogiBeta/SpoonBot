
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>bot-name と連携する</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <a href="/spoonbot/connect" class="brand">spoonbot</a>
    </header>

    <section class="connect">
      <div class="bot-mark" aria-hidden="true">
        <img src="/assets/image/bot-icon.svg" />
      </div>

      <h1>
        <span class="bot-name"></span> と連携する
      </h1>

      <p class="description">
        Spoomアプリのアカウントと連携して、<br class="desktop-only">
        貴方の枠でサードパーティーボットを利用できるようになります。
      </p>

      <div class="info">
        <p class="info-title">連携について</p>
        <p>
          連携ボタンを押すと、Spoonの認証画面に移動します。
          画面の案内に従って連携を完了してください。
        </p>
      </div>

      <a href="/oauth" class="connect-button">
        ボットを連携する
        <img src="/assets/image/arrow-right.svg" width="24" />
      </a>

      <p class="help">
        心当たりのないボットの場合は、連携しないでください。
      </p>
    </section>

    <footer class="footer">
      <span>Powered by</span>
      <strong>spoonbot lib</strong>
      <span>·</span>
      <span>made by YomogiBeta</span>
    </footer>
  </main>

  <script src="/assets/javascript/main.js" type="module"></script>
</body>
</html>
