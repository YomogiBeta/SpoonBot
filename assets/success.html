
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ボットとの連携が完了しました。">
  <title>連携完了 | spoonbot</title>
  <link rel="stylesheet" href="/assets/css//success.css">
</head>
<body class="success-page">
  <header class="success-header">
    <a href="/" class="success-brand">spoonbot</a>
  </header>

  <main class="success-main">
    <section class="success-content" aria-labelledby="success-title">

      <div class="success-icon" aria-hidden="true">
        <img src="/assets/image/check.svg" />
      </div>

      <p class="success-eyebrow">CONNECTION COMPLETE</p>

      <h1 id="success-title" class="success-title">
        ボットとの連携が完了しました
      </h1>

      <p class="success-description">
        本家アプリとの連携が正常に完了しました。
        続けて、ボット招待ページへ進んでください。
      </p>

      <div class="success-status">
        <span class="success-status-dot" aria-hidden="true"></span>
        <span class="success-status-label">連携済み</span>
        <span class="success-status-name">bot-name</span>
      </div>

      <a href="/spoonbot/invite" class="success-invite-button">
        <span>ボット招待ページへ</span>
								<img src="/assets/image/arrow-right.svg" width="24" />
      </a>

      <p class="success-help">
        招待ページでボットの案内に従って操作してください。
      </p>

    </section>
  </main>

  <footer class="success-footer">
    <span>Powered by</span>
    <strong>spoonbot lib</strong>
    <span class="success-footer-separator" aria-hidden="true">·</span>
    <span>made by YomogiBeta</span>
  </footer>
</body>
</html>
